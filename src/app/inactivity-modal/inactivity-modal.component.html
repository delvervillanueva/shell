<div class="inactivity-modal">
  <div class="inactivity-modal__container">
    <!-- Logo Santander Consumer en la esquina superior derecha -->
    <div class="inactivity-modal__logo">
      <svg width="160" height="45" viewBox="0 0 160 45" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Icono de llama estilizado sobre la 'a' -->
        <g transform="translate(0, 2)">
          <path d="M 20 6 C 20 4, 21 2, 22 2 C 23 2, 24 4, 24 6 C 24 8, 22 10, 22 12 L 22 14 C 22 15, 21 15, 20 14 L 20 12 C 20 10, 18 8, 20 6 Z" fill="#E30613"/>
          <path d="M 21 4 C 21 3, 21.5 2.5, 22 2.5 C 22.5 2.5, 23 3, 23 4 C 23 5, 22 6, 22 7 L 22 8 C 22 8.5, 21.5 8.5, 21 8 L 21 7 C 21 6, 20 5, 21 4 Z" fill="#FFFFFF" opacity="0.3"/>
        </g>
        <!-- Texto "Santander" en rojo -->
        <text x="28" y="20" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E30613" letter-spacing="-0.3px">Santander</text>
        <!-- Texto "Consumer" en gris oscuro -->
        <text x="28" y="35" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#4A4A4A" letter-spacing="-0.2px">Consumer</text>
      </svg>
    </div>

    <div class="inactivity-modal__content">
      <!-- Ilustración: Imagen de error -->
      <div class="inactivity-modal__icon">
        <img [src]="imagePath | prefixAsset" [alt]="alt" />
      </div>
      <div>
        <h1 class="inactivity-modal__title">Tu sesión ha expirado</h1>
        <p class="inactivity-modal__subtitle">
          Por tu seguridad, hemos cerrado tu sesión por inactividad. Serás redirigido a la página de inicio.
        </p>
      </div>
    </div>

    <div class="inactivity-modal__footer">
      <std-button
        class="inactivity-modal__button"
        [label]="buttonLabel"
        (click)="onVolver()"
      />
    </div>
  </div>
</div>
